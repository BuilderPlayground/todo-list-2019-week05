<!DOCTYPE html>
<html lang="en">
	<head>
  	<meta charset="utf-8">
  	<meta name="description" content="Simple JavaScript to-do list">
  	<meta name="keywords" content="goals, to-do list, productivity">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		
		<title>Things To Do</title>

		<!-- external CSS link -->
		<!-- <link rel="stylesheet" href="css/normalize.css"> -->
		<link rel="stylesheet" href="css/style.css">
	</head>
<body>

  <main class="todo-container">

    <p class="eyebrow">One Thing at a Time</p>

    <h1>Things To Do</h1>

    <p class="intro">Add a task and clear a little space in your head.</p>


    <section class="task-entry">

      <input
        type="text"
        id="taskInput"
        placeholder="What needs to get done?">

      <button id="addTask">
        Add
      </button>

    </section>

    <ul id="taskList">

	</ul>

    <button id="clearTasks" class="clear-button">
      Clear All
    </button>

  </main>

  <!-- <script src="js/main.js"></script> -->
		<script type="text/javascript" src="js/main.js"></script>
	
</body>
</html>
